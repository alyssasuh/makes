  <head>
    <meta charset="UTF-8">

    <title>Page Under Construction</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f5ef;
        color: #2a2722;
      }

      .message {
        position: relative;
        text-align: center;
        padding: 0;
        max-width: min(90vw, 1100px);
        width: 100%;
      }

      .message__headline {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 3.25rem);
        letter-spacing: 0.02em;
        text-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        width: 80%;
        line-height: 1.2;
      }

      .under-construction-image {
        display: block;
        width: 100%;
        max-height: 70vh;
        margin-top: 1.5rem;
        object-fit: contain;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="message">
      <h1 class="message__headline">Sorry, page under construction...</h1>
      <img src="Construction.png" alt="Construction illustration" class="under-construction-image" loading="lazy">
    </div>
